<!DOCTYPE html> <!-- HTML5 문서 표준 유형을 정의합니다. -->
<html lang="ko"> <!-- 문서의 기본 언어를 한국어(ko)로 지정합니다. -->
<head> <!-- 문서의 메타데이터와 외부 리소스 연동 정보를 담는 헤더 영역입니다. -->
    <meta charset="UTF-8"> <!-- 문자 인코딩 방식을 UTF-8로 설정하여 한글 깨짐을 방지합니다. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- 모바일 및 다양한 기기 화면 비율을 맞추는 모바일 반응형 설정입니다. -->
    <title>3D Monster Game</title> <!-- 웹 브라우저 탭에 표시되는 페이지 제목입니다. -->

    <!-- 스타일시트(CSS) 시작 영역입니다. -->
    <style>
        /* 모든 요소의 마진과 패딩을 0으로 초기화하고 박스 크기 기준을 border-box로 설정합니다. */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        /* 전체 화면의 배경색을 검은색으로 설정하고 폰트 및 스크롤바 감춤을 처리합니다. */
        body { width: 100vw; height: 100vh; overflow: hidden; background-color: #111; font-family: 'Malgun Gothic', sans-serif; }
        
        /* 화면 중앙에 위치할 인증 및 캐릭선택 컨테이너 레이아웃입니다. */
        .overlay-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; background-color: rgba(0, 0, 0, 0.85); color: #fff; }
        
        /* 입력 폼 상자의 디자인을 정의합니다. */
        .form-box { background: #222; padding: 30px; border-radius: 12px; box-shadow: 0 0 20px rgba(0,255,200,0.2); width: 350px; text-align: center; border: 1px solid #333; }
        
        /* 각 화면 타이틀 텍스트 스타일입니다. */
        h2 { margin-bottom: 20px; color: #00ffcc; font-size: 24px; }
        
        /* 입력 창(이메일, 비밀번호)의 스타일을 정의합니다. */
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #444; background: #111; color: #fff; border-radius: 6px; font-size: 14px; outline: none; }
        
        /* 입력 창 포커스 시 테두리 색상을 변경합니다. */
        input:focus { border-color: #00ffcc; }
        
        /* 버튼 공통 스타일을 정의합니다. */
        button { width: 100%; padding: 12px; margin-top: 10px; border: none; background: #00ffcc; color: #000; font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 15px; transition: 0.2s; }
        
        /* 버튼 마우스 오버 효과입니다. */
        button:hover { background: #00cca3; }
        
        /* 서브 버튼(회원가입 등) 스타일을 정의합니다. */
        button.sub-btn { background: #444; color: #fff; }
        
        /* 서브 버튼 마우스 오버 효과입니다. */
        button.sub-btn:hover { background: #555; }
        
        /* 캐릭터 선택 카드들을 담는 컨테이너 레이아웃입니다. */
        .character-container { display: flex; gap: 20px; margin-top: 20px; }
        
        /* 캐릭터 선택 카드 하나의 스타일을 정의합니다. */
        .char-card { background: #222; border: 2px solid #444; border-radius: 10px; padding: 20px; width: 150px; text-align: center; cursor: pointer; transition: 0.3s; }
        
        /* 캐릭터 선택 카드 마우스 호버 시 강조 스타일입니다. */
        .char-card:hover { border-color: #00ffcc; transform: translateY(-5px); }
        
        /* 상태 알림 및 에러 메시지 출력 텍스트 스타일입니다. */
        #message-box { margin-top: 15px; font-size: 13px; color: #ff5555; min-height: 18px; }
        
        /* 3D 화면 캔버스 영역을 전체 화면으로 설정합니다. */
        #game-canvas { width: 100%; height: 100%; display: block; }
        
        /* 숨김 처리용 클래스입니다. */
        .hidden { display: none !important; }
    </style>

    <!-- Firebase App 라이브러리를 로드합니다. -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <!-- Firebase Authentication 라이브러리를 로드합니다. -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <!-- Firebase Firestore 데이터베이스 라이브러리를 로드합니다. -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <!-- 3D 그래픽 처리를 위한 Three.js 엔진을 로드합니다. -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- GLB 3D 모델 파일을 로드하기 위한 GLTFLoader 라이브러리를 로드합니다. -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body> <!-- 사용자에게 보여지는 화면 영역입니다. -->

    <!-- 1. 로그인 및 회원가입 화면 레이아웃입니다. -->
    <div id="auth-screen" class="overlay-screen">
        <!-- 로그인/회원가입 입력 상자입니다. -->
        <div class="form-box">
            <!-- 화면 제목입니다. -->
            <h2 id="form-title">로그인</h2>
            <!-- 이메일 입력 필드입니다. -->
            <input type="email" id="email-input" placeholder="이메일을 입력하세요">
            <!-- 비밀번호 입력 필드입니다. -->
            <input type="password" id="password-input" placeholder="비밀번호를 입력하세요">
            <!-- 로그인 실행 버튼입니다. -->
            <button id="login-btn" onclick="handleLogin()">로그인</button>
            <!-- 회원가입 실행 버튼입니다. -->
            <button id="signup-btn" class="sub-btn" onclick="handleSignUp()">회원가입</button>
            <!-- 알림 및 에러 메시지가 표기되는 영역입니다. -->
            <div id="message-box"></div>
        </div>
    </div>

    <!-- 2. 캐릭터 선택 화면 레이아웃입니다 (기본적으로 숨김 처리). -->
    <div id="character-screen" class="overlay-screen hidden">
        <!-- 캐릭터 선택 화면 제목입니다. -->
        <h2>플레이어 캐릭터 선택</h2>
        <!-- 캐릭터 카드 카테고리 영역입니다. -->
        <div class="character-container">
            <!-- monster1 선택 카드입니다. -->
            <div class="char-card" onclick="selectCharacter('test/monster1.glb')">
                <h3>Monster 1</h3>
                <button>선택하기</button>
            </div>
            <!-- monster2 선택 카드입니다. -->
            <div class="char-card" onclick="selectCharacter('test/monster2.glb')">
                <h3>Monster 2</h3>
                <button>선택하기</button>
            </div>
            <!-- monster3 선택 카드입니다. -->
            <div class="char-card" onclick="selectCharacter('test/monster3.glb')">
                <h3>Monster 3</h3>
                <button>선택하기</button>
            </div>
        </div>
    </div>

    <!-- 3D 모델이 렌더링될 HTML5 캔버스 요소입니다. -->
    <canvas id="game-canvas"></canvas>

    <!-- 자바스크립트(JS) 로직 시작 영역입니다. -->
    <script>
        // 제공해주신 Firebase 설정 객체입니다.
        const firebaseConfig = {
            apiKey: "AIzaSyDfWAb7IevPJOIeGV8AbrIJiSqBQ0Y4yPQ", // API 키
            authDomain: "test-game-6d14a.firebaseapp.com", // 인증 도메인
            projectId: "test-game-6d14a", // 프로젝트 ID
            storageBucket: "test-game-6d14a.firebasestorage.app", // 스토리지 버킷
            messagingSenderId: "366641645044", // 메세징 발신자 ID
            appId: "1:366641645044:web:d81cc142692edde9eca5a1", // 앱 ID
            measurementId: "G-J24FYTRLXR" // 측정 ID
        };

        // Firebase 인스턴스를 초기화합니다.
        firebase.initializeApp(firebaseConfig);
        // Firebase 인증 객체를 생성합니다.
        const auth = firebase.auth();
        // Firebase Firestore 데이터베이스 객체를 생성합니다.
        const db = firebase.firestore();

        // 최대 접속 허용 회원 수를 15명으로 설정합니다.
        const MAX_USERS = 15;

        // 현재 로그인한 내 계정의 Unique ID를 저장하는 변수입니다.
        let myUserId = null;

        // 다른 플레이어들의 3D 메쉬 객체들을 관리하는 맵 객체입니다 (Key: userId, Value: Mesh/Group).
        const remotePlayers = {};

        // 메세지 출력 보조 함수입니다.
        function showMessage(msg) {
            // 메세지 박스 요소를 가져와 텍스트를 출력합니다.
            document.getElementById('message-box').innerText = msg;
        }

        // 회원가입 처리 함수입니다.
        async function handleSignUp() {
            // 이메일 입력값을 가져옵니다.
            const email = document.getElementById('email-input').value;
            // 비밀번호 입력값을 가져옵니다.
            const password = document.getElementById('password-input').value;

            // 이메일이나 비밀번호가 비어있는지 확인합니다.
            if (!email || !password) {
                // 경고 메세지를 출력합니다.
                showMessage("이메일과 비밀번호를 모두 입력해 주세요.");
                // 함수 실행을 중단합니다.
                return;
            }

            try {
                // 등록된 전체 사용자 수를 확인하기 위해 'users' 컬렉션을 조회합니다.
                const usersSnapshot = await db.collection('users').get();
                // 현재 가입된 회원 수가 최대 인원(15명) 이상인지 체크합니다.
                if (usersSnapshot.size >= MAX_USERS) {
                    // 제한 인원 초과 메세지를 출력합니다.
                    showMessage(`최대 회원 수(${MAX_USERS}명)가 초과되어 회원가입이 불가능합니다.`);
                    // 회원가입을 거부하고 함수를 종료합니다.
                    return;
                }

                // Firebase Auth를 이용해 이메일과 비밀번호로 계정을 생성합니다.
                const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                // 생성된 유저 정보 객체를 가져옵니다.
                const user = userCredential.user;
                // 내 유저 ID를 저장합니다.
                myUserId = user.uid;

                // Firestore 데이터베이스의 'users' 컬렉션에 새 회원 정보를 저장합니다.
                await db.collection('users').doc(user.uid).set({
                    email: user.email, // 이메일 저장
                    createdAt: firebase.firestore.FieldValue.serverTimestamp() // 가입 시간 저장
                });

                // 성공 메세지를 출력합니다.
                showMessage("회원가입 성공! 로그인 중...");
            } catch (error) {
                // 예외 발생 시 에러 메세지를 출력합니다.
                showMessage("회원가입 실패: " + error.message);
            }
        }

        // 로그인 처리 함수입니다.
        async function handleLogin() {
            // 이메일 입력값을 가져옵니다.
            const email = document.getElementById('email-input').value;
            // 비밀번호 입력값을 가져옵니다.
            const password = document.getElementById('password-input').value;

            // 입력값 유효성을 검사합니다.
            if (!email || !password) {
                // 경고 메세지를 출력합니다.
                showMessage("이메일과 비밀번호를 입력해 주세요.");
                // 함수를 종료합니다.
                return;
            }

            try {
                // Firebase Auth를 통해 이메일/비밀번호 로그인을 시도합니다.
                const userCredential = await auth.signInWithEmailAndPassword(email, password);
                // 로그인된 유저 ID를 기록합니다.
                myUserId = userCredential.user.uid;
                // 로그인 성공 메세지를 출력합니다.
                showMessage("로그인 성공!");
                // 로그인 화면을 숨깁니다.
                document.getElementById('auth-screen').classList.add('hidden');
                // 캐릭터 선택 화면을 표시합니다.
                document.getElementById('character-screen').classList.remove('hidden');
            } catch (error) {
                // 로그인 실패 메세지를 출력합니다.
                showMessage("로그인 실패: " + error.message);
            }
        }

        // 3D 환경 구성을 위한 변수들을 선언합니다.
        let scene, camera, renderer, currentModel;

        // 키보드 입력을 누르고 있는지 상태를 저장하는 객체입니다.
        const keysPressed = {};

        // 이동 및 물리 처리를 위한 변수입니다.
        const moveSpeed = 0.1; // 플레이어의 이동 속도입니다.
        let velocityY = 0; // 플레이어의 Y축(상하) 수직 속도입니다.
        const gravity = -0.01; // 아래로 끌어내리는 중력 값입니다.
        const jumpPower = 0.25; // 점프 시 위로 튀어오르는 힘입니다.
        let isGrounded = true; // 현재 땅에 닿아있는지 여부입니다.
        let groundY = 0; // 바닥면의 Y축 기준 높이값입니다.

        // 카메라 회전 관련 변수들을 설정합니다.
        let isMouseDown = false; // 마우스 좌클릭 누름 상태값입니다.
        let previousMousePosition = { x: 0, y: 0 }; // 이전 마우스 x, y 위치값입니다.
        let cameraAngleX = 0; // 카메라 수평 회전 각도(라디안)입니다.
        let cameraAngleY = 0.3; // 카메라 수직 회전 각도(라디안)입니다.
        const cameraDistance = 6; // 플레이어와 카메라 사이의 거리입니다.

        // 3D 공간을 초기화하는 함수입니다.
        function init3D() {
            // 3D 장르 요소들을 담는 Scene(장면)을 생성합니다.
            scene = new THREE.Scene();
            // Scene의 배경색을 어두운 회색으로 지정합니다.
            scene.background = new THREE.Color(0x1a1a1a);

            // 카메라를 생성합니다 (가시각 75도, 화면비율, 최소/최대 출력거리).
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

            // 렌더러를 생성하고 기존 생성한 game-canvas 요소와 연결합니다.
            const canvasElement = document.getElementById('game-canvas');
            renderer = new THREE.WebGLRenderer({ canvas: canvasElement, antialias: true });
            // 렌더러의 크기를 현재 브라우저 창 크기에 맞춥니다.
            renderer.setSize(window.innerWidth, window.innerHeight);
            // 디바이스의 화소 비율을 반영합니다.
            renderer.setPixelRatio(window.devicePixelRatio);

            // 전체적인 조명을 주어 무대를 밝히는 AmbientLight를 추가합니다.
            const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
            // 빛을 장면(Scene)에 추가합니다.
            scene.add(ambientLight);

            // 특정 방향에서 비추는 직사광선 조명을 추가합니다.
            const directionalLight = new THREE.DirectionalLight(0xffffff, 2);
            // 조명의 위치를 설정합니다.
            directionalLight.position.set(5, 10, 7.5);
            // 직사광선을 장면(Scene)에 추가합니다.
            scene.add(directionalLight);

            // 바닥을 나타내는 바둑판 무늬 그리드 헬퍼를 생성합니다.
            const gridHelper = new THREE.GridHelper(20, 20, 0x00ffcc, 0x444444);
            // 그리드 헬퍼를 장면(Scene)에 추가합니다.
            scene.add(gridHelper);

            // 키보드를 눌렀을 때의 이벤트 리스너를 등록합니다.
            window.addEventListener('keydown', (event) => {
                // 눌려진 키의 상태를 true로 설정합니다 (대소문자 구분 없이 처리하기 위해 toLowerCase 사용).
                keysPressed[event.key.toLowerCase()] = true;
                // 스페이스 바 입력 상태도 저장합니다.
                if (event.code === 'Space') keysPressed['space'] = true;
            });

            // 키보드 키에서 손을 뗐을 때의 이벤트 리스너를 등록합니다.
            window.addEventListener('keyup', (event) => {
                // 뗀 키의 상태를 false로 설정합니다.
                keysPressed[event.key.toLowerCase()] = false;
                // 스페이스 바 해제 상태를 저장합니다.
                if (event.code === 'Space') keysPressed['space'] = false;
            });

            // 마우스 버튼을 눌렀을 때 이벤트 처리입니다.
            window.addEventListener('mousedown', (event) => {
                // 좌클릭(button === 0)인 경우에만 회전 기능을 활성화합니다.
                if (event.button === 0) {
                    isMouseDown = true; // 마우스 눌림 상태를 true로 지정합니다.
                    previousMousePosition = { x: event.clientX, y: event.clientY }; // 현재 마우스 좌표를 기록합니다.
                }
            });

            // 마우스 버튼을 뗐을 때 이벤트 처리입니다.
            window.addEventListener('mouseup', (event) => {
                // 좌클릭을 뗐다면 회전 상태를 해제합니다.
                if (event.button === 0) {
                    isMouseDown = false;
                }
            });

            // 마우스를 움직일 때 이벤트 처리입니다.
            window.addEventListener('mousemove', (event) => {
                // 마우스 좌클릭을 누르고 있는 상태가 아니라면 동작하지 않습니다.
                if (!isMouseDown) return;

                // 이전 좌표와의 차이(Delta)를 계산합니다.
                const deltaX = event.clientX - previousMousePosition.x;
                const deltaY = event.clientY - previousMousePosition.y;

                // 마우스 이동량에 비례하여 카메라 회전 각도를 변경합니다 (감도 0.005).
                cameraAngleX -= deltaX * 0.005; // 좌우 회전
                cameraAngleY += deltaY * 0.005; // 상하 회전

                // 카메라가 땅 밑으로 들어가거나 뒤집히지 않도록 상하 각도를 제한합니다 (0.1 ~ 1.4 라디안).
                cameraAngleY = Math.max(0.1, Math.min(1.4, cameraAngleY));

                // 현재 마우스 좌표를 다음 프레임 계산을 위해 저장합니다.
                previousMousePosition = { x: event.clientX, y: event.clientY };
            });

            // 다른 플레이어들의 위치를 실시간으로 수신받는 Firestore Listeners 설정 함수를 실행합니다.
            setupMultiplayerListener();

            // 매 프레임마다 화면을 갱신하는 렌더링 애니메이션 루프를 실행합니다.
            animate();
        }

        // 나의 현재 3D 위치 및 회전 좌표를 Firebase Firestore에 업데이트하는 함수입니다.
        function updateMyPositionToFirebase() {
            // 유저 ID와 내 모델이 있을 때만 데이터를 전송합니다.
            if (!myUserId || !currentModel) return;

            // 'players' 컬렉션에 나의 위치 및 회전 정보를 저장/갱신합니다.
            db.collection('players').doc(myUserId).set({
                x: currentModel.position.x, // x좌표
                y: currentModel.position.y, // y좌표
                z: currentModel.position.z, // z좌표
                rotationY: currentModel.rotation.y, // Y축 회전값
                updatedAt: firebase.firestore.FieldValue.serverTimestamp() // 갱신 시각
            }, { merge: true });
        }

        // 다른 플레이어용 대체 모델(파란색 정육면체)을 생성하는 함수입니다.
        function createRemotePlayerMesh() {
            // 정육면체 형상 생성 (가로 1, 세로 1, 높이 1)
            const geometry = new THREE.BoxGeometry(1, 1, 1);
            // 나(빨간색)와 구분하기 위해 파란색 재질을 적용합니다.
            const material = new THREE.MeshStandardMaterial({ color: 0x0088ff });
            // 메쉬 객체를 생성합니다.
            const mesh = new THREE.Mesh(geometry, material);
            // 메쉬를 반환합니다.
            return mesh;
        }

        // 실시간으로 접속한 타 플레이어의 위치 정보를 수신받아 3D 무대에 렌더링하는 함수입니다.
        function setupMultiplayerListener() {
            // Firestore 'players' 컬렉션의 실시간 변화 감지 수신기를 등록합니다.
            db.collection('players').onSnapshot((snapshot) => {
                // 수신된 모든 플레이어 문서를 반복 처리합니다.
                snapshot.forEach((doc) => {
                    const playerId = doc.id; // 타 유저의 Document ID
                    const data = doc.data(); // 위치 데이터

                    // 내 정보이거나 데이터가 없으면 동기화 대상에서 제외합니다.
                    if (playerId === myUserId || !data) return;

                    // 아직 3D 무대에 생성되지 않은 새로운 플레이어라면
                    if (!remotePlayers[playerId]) {
                        // 타 플레이어용 3D 메쉬를 생성합니다.
                        const newRemoteMesh = createRemotePlayerMesh();
                        // 3D Scene에 추가합니다.
                        scene.add(newRemoteMesh);
                        // 맵에 등록합니다.
                        remotePlayers[playerId] = newRemoteMesh;
                    }

                    // 수신받은 좌표로 타 플레이어 3D 메쉬의 위치를 이동시킵니다.
                    remotePlayers[playerId].position.set(data.x || 0, data.y || 0, data.z || 0);
                    // Y축 회전값도 적용해 줍니다.
                    if (data.rotationY !== undefined) {
                        remotePlayers[playerId].rotation.y = data.rotationY;
                    }
                });
            });
        }

        // 플레이어 움직임 및 물리 연산을 처리하는 함수입니다.
        function updatePlayerMovement() {
            // 조종할 캐릭터 모델이 존재하는지 체크합니다.
            if (!currentModel) return;

            // 이동 발생 여부를 추적하는 변수입니다.
            let moved = false;

            // W 키가 눌렸을 때 : 카메라 바라보는 정면 방향으로 이동
            if (keysPressed['w']) {
                currentModel.position.x -= Math.sin(cameraAngleX) * moveSpeed;
                currentModel.position.z -= Math.cos(cameraAngleX) * moveSpeed;
                moved = true;
            }
            // S 키가 눌렸을 때 : 카메라 바라보는 반대 방향으로 이동
            if (keysPressed['s']) {
                currentModel.position.x += Math.sin(cameraAngleX) * moveSpeed;
                currentModel.position.z += Math.cos(cameraAngleX) * moveSpeed;
                moved = true;
            }
            // A 키가 눌렸을 때 : 카메라 바라보는 기준 왼쪽으로 이동
            if (keysPressed['a']) {
                currentModel.position.x -= Math.cos(cameraAngleX) * moveSpeed;
                currentModel.position.z += Math.sin(cameraAngleX) * moveSpeed;
                moved = true;
            }
            // D 키가 눌렸을 때 : 카메라 바라보는 기준 오른쪽으로 이동
            if (keysPressed['d']) {
                currentModel.position.x += Math.cos(cameraAngleX) * moveSpeed;
                currentModel.position.z -= Math.sin(cameraAngleX) * moveSpeed;
                moved = true;
            }

            // 스페이스 바가 눌렸고, 현재 땅에 착지해 있는 상태라면 점프를 실행합니다.
            if (keysPressed['space'] && isGrounded) {
                // 수직 속도에 점프력을 부여합니다.
                velocityY = jumpPower;
                // 공중에 떠있는 상태로 변경합니다.
                isGrounded = false;
                moved = true;
            }

            // 땅에 있지 않은 경우(공중에 뜬 경우) 중력을 적용합니다.
            if (!isGrounded) {
                // Y축 위치에 수직 속도를 더해줍니다.
                currentModel.position.y += velocityY;
                // 속도에 중력을 더해 점차 아래로 떨어지게 만듭니다.
                velocityY += gravity;

                // 모델의 Y위치가 바닥 높이 이하로 내려왔을 경우 (착지 처리)
                if (currentModel.position.y <= groundY) {
                    // Y 위치를 정확히 바닥 높이로 맞춥니다.
                    currentModel.position.y = groundY;
                    // 수직 속도를 0으로 초기화합니다.
                    velocityY = 0;
                    // 땅에 닿은 상태로 전환합니다.
                    isGrounded = true;
                }
                moved = true;
            }

            // 플레이어가 이동하거나 점프했다면 내 위치 데이터를 Firebase에 갱신합니다.
            if (moved) {
                updateMyPositionToFirebase();
            }

            // 계산된 회전 각도(cameraAngleX, cameraAngleY)를 바탕으로 플레이어 주변 구면 좌표상의 카메라 위치를 구합니다.
            camera.position.x = currentModel.position.x + cameraDistance * Math.sin(cameraAngleX) * Math.cos(cameraAngleY);
            camera.position.z = currentModel.position.z + cameraDistance * Math.cos(cameraAngleX) * Math.cos(cameraAngleY);
            camera.position.y = currentModel.position.y + cameraDistance * Math.sin(cameraAngleY);

            // 카메라는 항상 플레이어 위치를 계속 바라보도록 합니다.
            camera.lookAt(currentModel.position.x, currentModel.position.y + 0.5, currentModel.position.z);
        }

        // 렌더링 애니메이션 루프 함수입니다.
        function animate() {
            // 다음 프레임 호출을 요청합니다.
            requestAnimationFrame(animate);

            // 매 프레임마다 플레이어 이동 및 카메라 회전 로직을 구동합니다.
            updatePlayerMovement();

            // 장면과 카메라를 기준으로 화면을 그려냅니다(렌더링).
            renderer.render(scene, camera);
        }

        // 모델이 없거나 로드에 실패했을 때 나타낼 빨간색 정육면체 생성 함수입니다.
        function createFallbackCube() {
            // 정육면체의 모양(가로 1, 세로 1, 높이 1)을 생성합니다.
            const geometry = new THREE.BoxGeometry(1, 1, 1);
            // 빨간색 재질을 생성합니다.
            const material = new THREE.MeshStandardMaterial({ color: 0xff0000 });
            // 형상과 재질을 합쳐 3D 메쉬 객체를 만듭니다.
            const cube = new THREE.Mesh(geometry, material);
            // 바닥 그리드 위에 올리기 위해 y축 위치를 0.5만큼 올려줍니다.
            cube.position.set(0, 0.5, 0);
            // 착지 바닥 높이를 정육면체 높이에 맞게 설정합니다.
            groundY = 0.5;
            // 생성한 정육면체 객체를 반환합니다.
            return cube;
        }

        // 캐릭터 선택 처리 함수입니다.
        function selectCharacter(modelPath) {
            // 캐릭터 선택 레이아웃을 숨깁니다.
            document.getElementById('character-screen').classList.add('hidden');

            // 3D 무대가 생성되지 않았다면 초기화합니다.
            if (!scene) {
                // 3D 환경을 생성합니다.
                init3D();
            }

            // 기존 무대에 모델이 있었다면 제거합니다.
            if (currentModel) {
                // 장면에서 이전 모델/정육면체를 삭제합니다.
                scene.remove(currentModel);
                // 변수를 비웁니다.
                currentModel = null;
            }

            // GLTF/GLB 로더 객체를 생성합니다.
            const loader = new THREE.GLTFLoader();

            // 지정된 경로의 3D 모델을 로드합니다.
            loader.load(
                // 파일 경로입니다.
                modelPath,
                // 로드 성공 시 실행되는 콜백 함수입니다.
                function (gltf) {
                    // 새로 로드된 GLB 캐릭터 모델을 변수에 저장합니다.
                    currentModel = gltf.scene;
                    // 바닥 기본 Y위치를 0으로 지정합니다.
                    groundY = 0;
                    // 모델의 위치를 원점(0,0,0)에 배치합니다.
                    currentModel.position.set(0, 0, 0);
                    // 모델을 장면(Scene)에 추가하여 3D 화면에 출력합니다.
                    scene.add(currentModel);
                    // 선택 완료 후 초기 위치를 Firebase에 동기화합니다.
                    updateMyPositionToFirebase();
                },
                // 로딩 진행 중 콜백 함수입니다.
                undefined,
                // 파일 연결 불가나 CORS 웹 규약으로 로드 실패 시 실행되는 에러 콜백 함수입니다.
                function (error) {
                    // 콘솔에 에러 내용을 기록합니다.
                    console.warn('3D 모델 파일 로드 불가 (보안 규약 또는 경로 오류). 대체 빨간색 정육면체를 생성합니다:', error);
                    // 빨간색 정육면체를 생성하여 대입합니다.
                    currentModel = createFallbackCube();
                    // 대체 모델을 장면(Scene)에 추가합니다.
                    scene.add(currentModel);
                    // 대체 모델 초기 위치를 Firebase에 동기화합니다.
                    updateMyPositionToFirebase();
                }
            );
        }

        // 브라우저 리사이즈 발생 시 3D 카메라 및 렌더러 크기를 맞추는 이벤트 리스너입니다.
        window.addEventListener('resize', () => {
            // 3D 렌더러가 활성화되어 있을 때만 실행합니다.
            if (camera && renderer) {
                // 카메라 아스펙트 비를 수정합니다.
                camera.aspect = window.innerWidth / window.innerHeight;
                // 변경된 아스펙트 사양을 카메라에 업데이트합니다.
                camera.updateProjectionMatrix();
                // 렌더러 크기를 새 화면 크기로 업데이트합니다.
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        });
    </script>
</body>
